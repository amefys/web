          <div class="ask"><b>选人建议<i class="free-tag">免费</i></b><q>现在选谁</q><span>先打开 BP 识别。</span></div>
          <div class="ask"><b>时间点<i class="free-tag">免费</i></b><q>下个符什么时候</q></div>
          <div class="ask"><b>翻译游戏聊天<i class="free-tag">免费</i></b><q>他们在说什么</q><span>识别聊天框，翻译给你听。</span></div>
          <div class="ask"><b>悬浮窗<i class="free-tag">免费</i></b><q>打开悬浮窗</q><span>也能说「收起悬浮窗」「锁定悬浮窗」。</span></div>
          <div class="ask"><b>BP 识别<i class="free-tag">免费</i></b><q>打开 BP</q></div>
          <div class="ask"><b>鼠标穿透<i class="free-tag">免费</i></b><q>别挡我</q><span>点击穿过她，直接点到游戏。</span></div>
          <div class="ask"><b>声音<i class="free-tag">免费</i></b><q>小声点</q><span>也能说「大声点」「静音」。</span></div>
          <div class="ask"><b>字幕<i class="free-tag">免费</i></b><q>关掉字幕</q></div>
          <div class="ask"><b>窗口形态<i class="free-tag">免费</i></b><q>缩成小球</q><span>说「还原」变回来。</span></div>
          <div class="ask"><b>换角色<i class="free-tag">免费</i></b><q>换成菲菲</q><span>五个角色随时换。</span></div>
          <div class="ask"><b>重复上一句<i class="free-tag">免费</i></b><q>再说一遍</q></div>
          <div class="ask"><b>打开软件页面<i class="free-tag">免费</i></b><q>打开设置</q><span>也能说「打开主界面」。</span></div>

    <section class="s" id="cant">
      <h2>她看不到的</h2>
      <div class="cant">问她<q>对面买了 BKB 没</q>，她会直说看不到。敌方的装备、位置和视野，游戏官方数据接口本来就不提供，我们也不读取游戏内存。她知道的只有你自己的数据：你的钱、等级、装备、击杀和死亡。</div>
    </section>

    <section class="s" id="tips">
      <h2>小提示</h2>
      <ul class="tips">
        <li><b>实时数据要开局后才有</b>：主菜单、选人阶段、赛后和观战时问钱和装备，她会告诉你开局后再问。</li>
        <li><b>装备俗称大多能认</b>：黑皇、BKB、跳刀、羊刀、A杖都行；大根、紫苑、狂战这几个叫法一词多指，请说全名。</li>
        <li><b>她只操作 AMEFYS 本身</b>：不会替你在游戏里按键、点击或发消息。</li>
        <li><b>聊天和点评由人工智能生成</b>，可能出错，请自己判断。</li>
      </ul>
      <p class="note center">目前只在国内版的 Windows 电脑版里提供，界面语言需为中文，登录后在左侧「AI 玩伴」页打开，也可以按 Alt + Shift + C。</p>
