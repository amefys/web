name: Baidu URL push

# Feeds amefys.com pages into Baidu's crawl queue (普通收录 API). Runs after
# every content deploy and once a day for the long-tail rotation. A no-op
# until the BAIDU_PUSH_TOKEN secret exists, so forks and the pre-registration
# period stay green.

on:
  schedule:
    - cron: "17 2 * * *" # 10:17 Beijing, daily
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.html"
      - "packs/**"
      - "guides/**"
      - "blog/**"
      - "sitemap.xml"
  workflow_dispatch:
    inputs:
      limit:
        description: "URLs to push this run"
        default: "10"
      urls:
        description: "Only these pages, comma-separated (e.g. /blog/,/blog/post.html). Empty = daily rotation"
        default: ""

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push URLs
        if: ${{ env.BAIDU_PUSH_TOKEN != '' }}
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          URLS: ${{ github.event.inputs.urls || '' }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A deploy that adds or edits blog posts pushes those pages first — otherwise a new
          # post waits weeks for its turn in the rotation (and the deploy's own run would
          # spend the day's quota on other pages).
          if [ -z "$URLS" ] && [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            URLS=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'blog/*.html' \
              | sed -e 's#index\.html$##' -e 's#^#/#' | paste -sd, -)
          fi
          if [ -n "$URLS" ]; then
            echo "pushing: $URLS"
            node scripts/baidu-push.mjs --limit "$LIMIT" --urls "$URLS"
          else
            node scripts/baidu-push.mjs --limit "$LIMIT"
          fi
      - name: Skipped
        if: ${{ env.BAIDU_PUSH_TOKEN == '' }}
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: echo "BAIDU_PUSH_TOKEN secret not set — skipping (register the site at ziyuan.baidu.com first)"
