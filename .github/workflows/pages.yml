name: Deploy GitHub Pages

# Publishes the static site at the repo root to GitHub Pages. Triggered
# on every push to main (any change to index.html, CNAME, assets/, etc.)
# and lets the new amefys/web release workflow (which runs in this same
# repo whenever the installer artifacts land) re-deploy the page without
# extra plumbing — the release upload commits nothing here, so this
# workflow is effectively a "deploy on content change" hook.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root contains index.html + CNAME; nothing to build.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Cloudflare caches HTML for an hour [Cache Rule in dashboard].
      # Without an explicit purge, users get the old page until that
      # TTL expires. Purge the zone right after Pages publishes the new
      # content. If the secrets are missing [e.g. someone forked the
      # repo] the step is a no-op so the deploy still succeeds.
      - name: Purge Cloudflare cache
        if: ${{ env.CF_ZONE_ID != '' && env.CF_API_TOKEN != '' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
