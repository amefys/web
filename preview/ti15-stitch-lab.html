<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TI15 · 刺绣打版实验室 · AMEFYS</title>
<style>
  /* ════════════════════════════════════════════════════════════════
   *  Stitch Lab — replicating the official embroidered-patch look
   *  the way real digitizing works:
   *    1. satin-stitch fill, stitch angle PER REGION (换向缎绣)
   *    2. region shine overlays — angle vs light = brightness
   *    3. feTurbulence displacement — threads bend, edges fray
   *    4. merrowed edge via thick dashed stroke = coil loops
   *    5. patch lift: warm glow + drop shadow on bokeh cloth
   * ════════════════════════════════════════════════════════════════ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #F2E6CB;
    background:
      radial-gradient(ellipse 60% 46% at 50% 30%, rgba(150,100,32,0.45) 0%, rgba(70,46,14,0.18) 50%, transparent 74%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.66  0 0 0 0 0.25  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>") repeat,
      linear-gradient(180deg, #150D06 0%, #0E0803 100%);
  }
  .bokeh {
    position: fixed; inset: 0; pointer-events: none; filter: blur(6px);
    background:
      radial-gradient(circle at 12% 26%, rgba(232,194,117,0.15) 0 18px, transparent 26px),
      radial-gradient(circle at 88% 20%, rgba(232,194,117,0.12) 0 22px, transparent 30px),
      radial-gradient(circle at 80% 76%, rgba(232,194,117,0.10) 0 26px, transparent 36px),
      radial-gradient(circle at 16% 82%, rgba(232,194,117,0.09) 0 20px, transparent 28px),
      radial-gradient(circle at 50% 92%, rgba(232,194,117,0.08) 0 24px, transparent 32px);
  }
  .wrap { position: relative; max-width: 1180px; margin: 0 auto; padding: 56px 40px 80px; text-align: center; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: 3px; color: rgba(242,230,203,0.5); text-transform: uppercase; margin-bottom: 48px; }
  h1 strong { color: #D9A93F; }
  .hero-patch { display: flex; justify-content: center; align-items: center; gap: 88px; margin-bottom: 56px; }
  .hero-patch figure { margin: 0; }
  .hero-patch figcaption { font-size: 11px; letter-spacing: 1.5px; color: rgba(242,230,203,0.4); margin-top: 10px; }
  .scales { display: flex; gap: 56px; justify-content: center; align-items: flex-end; margin-bottom: 48px; }
  .cap { font-size: 11px; letter-spacing: 1.5px; color: rgba(242,230,203,0.4); margin-top: 14px; }
  .notes {
    max-width: 660px; margin: 0 auto; text-align: left;
    font-size: 12.5px; line-height: 2; color: rgba(242,230,203,0.55);
    border-top: 1px solid rgba(217,169,63,0.18); padding-top: 24px;
  }
  .notes em { font-style: normal; color: #D9A93F; }
</style>
</head>
<body>
<div class="bokeh"></div>
<div class="wrap">
  <h1><strong>Stitch Lab</strong> · 换向缎绣 + 锁边线圈 + 线头扰动 — 全 SVG 打版复刻</h1>

  <!-- ═══ The embroidered Aegis patch, fully digitized ═══
       Region stitch angles:
         left shield face  72°  (bright — faces the light)
         right shield face 108° (dark — turned away)
         crown             20°
         wings             145°
         center diamond    45° crimson satin
       Edges: merrow coil = thick dashed stroke along the outline.
       Whole patch passes through #silk (turbulence displacement). -->
  <div class="hero-patch">

    <!-- ═══ Variant B: "ring + pedestal" — silhouette homage to the
         official Aegis COMPOSITION (round medallion over a pedestal
         with side ears), but the artwork is original: the ring is
         4-sector direction-changed gold satin, the core is our own
         crimson knot + four petals — NOT the off-center Dota circle. -->
    <figure>
      <svg width="380" height="442" viewBox="-12 -12 164 190" role="img" aria-label="ring-and-pedestal original patch">
        <g filter="url(#silk)">
          <!-- underlay shadow -->
          <g transform="translate(3 5.5)" opacity="0.55">
            <circle cx="70" cy="58" r="48" fill="#0C0703"/>
            <path d="M16 96 L8 92 L8 110 L16 114 Q30 134 70 140 Q110 134 124 114 L132 110 L132 92 L124 96 Z" fill="#0C0703"/>
          </g>
          <!-- pedestal: silver satin, split light/dark -->
          <path d="M16 96 L8 92 L8 110 L16 114 Q30 134 70 140 L70 96 Z" fill="url(#t72)"/>
          <path d="M70 96 L70 140 Q110 134 124 114 L132 110 L132 92 L124 96 Z" fill="url(#t108)"/>
          <path d="M16 96 L8 92 L8 110 L16 114 Q30 134 70 140 L70 96 Z" fill="url(#shineL)" opacity="0.6"/>
          <path d="M70 96 L70 140 Q110 134 124 114 L132 110 L132 92 L124 96 Z" fill="url(#shineR)" opacity="0.6"/>
          <!-- ring: gold satin, 4 sectors with rotated stitch angles -->
          <path d="M70 10 A48 48 0 0 1 118 58 L103 58 A33 33 0 0 0 70 25 Z" fill="url(#t20)"/>
          <path d="M118 58 A48 48 0 0 1 70 106 L70 91 A33 33 0 0 0 103 58 Z" fill="url(#t145)"/>
          <path d="M70 106 A48 48 0 0 1 22 58 L37 58 A33 33 0 0 0 70 91 Z" fill="url(#t20)"/>
          <path d="M22 58 A48 48 0 0 1 70 10 L70 25 A33 33 0 0 0 37 58 Z" fill="url(#t145)"/>
          <circle cx="70" cy="58" r="48" fill="url(#shineL)" opacity="0.35"/>
          <!-- original core: crimson french-knot + four gold petals -->
          <path d="M70 33 C76 41 76 49 70 55 C64 49 64 41 70 33 Z" fill="url(#t20)"/>
          <path d="M70 83 C76 75 76 67 70 61 C64 67 64 75 70 83 Z" fill="url(#t20)"/>
          <path d="M45 58 C53 52 61 52 67 58 C61 64 53 64 45 58 Z" fill="url(#t145)"/>
          <path d="M95 58 C87 52 79 52 73 58 C79 64 87 64 95 58 Z" fill="url(#t145)"/>
          <circle cx="70" cy="58" r="11" fill="url(#t45r)"/>
          <circle cx="70" cy="58" r="11" fill="url(#shineL)" opacity="0.4"/>
        </g>
        <g filter="url(#silk-lite)">
          <!-- pedestal coil first (ring coil paints over its top) -->
          <path d="M16 96 L8 92 L8 110 L16 114 Q30 134 70 140 Q110 134 124 114 L132 110 L132 92 L124 96 Z"
                fill="none" stroke="#5A430F" stroke-width="7" stroke-linejoin="round"/>
          <path d="M16 96 L8 92 L8 110 L16 114 Q30 134 70 140 Q110 134 124 114 L132 110 L132 92 L124 96 Z"
                fill="none" stroke="url(#coil)" stroke-width="6" stroke-linejoin="round" stroke-dasharray="2.2 1.4" stroke-linecap="round"/>
          <!-- ring coils: outer + inner -->
          <circle cx="70" cy="58" r="48" fill="none" stroke="#5A430F" stroke-width="8"/>
          <circle cx="70" cy="58" r="48" fill="none" stroke="url(#coil)" stroke-width="7" stroke-dasharray="2.3 1.4" stroke-linecap="round"/>
          <circle cx="70" cy="58" r="33" fill="none" stroke="#5A430F" stroke-width="5"/>
          <circle cx="70" cy="58" r="33" fill="none" stroke="url(#coil)" stroke-width="4.2" stroke-dasharray="2 1.3" stroke-linecap="round"/>
          <!-- core coil -->
          <circle cx="70" cy="58" r="11" fill="none" stroke="url(#coil)" stroke-width="3.4" stroke-dasharray="1.8 1.2" stroke-linecap="round"/>
        </g>
      </svg>
      <figcaption>B · 圆环盾座 — 构图致敬 · 图形原创</figcaption>
    </figure>

    <figure>
    <svg width="420" height="540" viewBox="-14 -22 148 204" role="img" aria-label="embroidered aegis">
      <defs>
        <!-- satin thread patterns, one per stitch angle -->
        <pattern id="t72"  width="2.5" height="2.5" patternUnits="userSpaceOnUse" patternTransform="rotate(72)">
          <rect width="2.5" height="2.5" fill="#C9C4B6"/>
          <line x1="0" y1="0" x2="0" y2="2.5" stroke="#F2EFE6" stroke-width="1.1"/>
          <line x1="1.3" y1="0" x2="1.3" y2="2.5" stroke="#8F897A" stroke-width="0.5"/>
        </pattern>
        <pattern id="t108" width="2.5" height="2.5" patternUnits="userSpaceOnUse" patternTransform="rotate(108)">
          <rect width="2.5" height="2.5" fill="#A8A294"/>
          <line x1="0" y1="0" x2="0" y2="2.5" stroke="#D8D3C6" stroke-width="1.1"/>
          <line x1="1.3" y1="0" x2="1.3" y2="2.5" stroke="#6E6857" stroke-width="0.5"/>
        </pattern>
        <pattern id="t20" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
          <rect width="2.4" height="2.4" fill="#C29435"/>
          <line x1="0" y1="0" x2="0" y2="2.4" stroke="#F0D88A" stroke-width="1.1"/>
          <line x1="1.3" y1="0" x2="1.3" y2="2.4" stroke="#7A5510" stroke-width="0.5"/>
        </pattern>
        <pattern id="t145" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(145)">
          <rect width="2.4" height="2.4" fill="#B98C2C"/>
          <line x1="0" y1="0" x2="0" y2="2.4" stroke="#E8C275" stroke-width="1.1"/>
          <line x1="1.3" y1="0" x2="1.3" y2="2.4" stroke="#6E4F12" stroke-width="0.5"/>
        </pattern>
        <pattern id="t45r" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="2.4" height="2.4" fill="#8E1F29"/>
          <line x1="0" y1="0" x2="0" y2="2.4" stroke="#C84450" stroke-width="1.1"/>
          <line x1="1.3" y1="0" x2="1.3" y2="2.4" stroke="#5E1018" stroke-width="0.5"/>
        </pattern>
        <!-- silk sheen sweeps -->
        <linearGradient id="shineL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
          <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="shineR" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
          <stop offset="0.6" stop-color="#000000" stop-opacity="0.16"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
        </linearGradient>
        <linearGradient id="coil" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F8E7B0"/>
          <stop offset="0.45" stop-color="#D9A93F"/>
          <stop offset="1" stop-color="#8F6A1A"/>
        </linearGradient>
        <!-- thread fray: HIGH-frequency micro jitter — frays the thread
             ends without bending the overall silhouette (official
             patches keep their outlines straight) -->
        <filter id="silk" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="turbulence" baseFrequency="0.5 0.55" numOctaves="2" seed="11" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- even lighter for the merrow coil: it stays crisp -->
        <filter id="silk-lite" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="turbulence" baseFrequency="0.55 0.6" numOctaves="1" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="0.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>

      <g filter="url(#silk)">
        <!-- ── underlay: dark cloth shadow beneath the patch ── -->
        <path d="M60 13 L99 31 L99 85 Q99 116 60 145 Q21 116 21 85 L21 31 Z"
              fill="#0C0703" opacity="0.55" transform="translate(3 5.5)"/>

        <!-- ── satin regions (stitch angle per region) ── -->
        <!-- left face: bright silver satin, 72° -->
        <path d="M60 22 L60 136 Q28 112 28 84 L28 38 Z" fill="url(#t72)"/>
        <path d="M60 22 L60 136 Q28 112 28 84 L28 38 Z" fill="url(#shineL)"/>
        <!-- right face: same silver, turned away → 108°, darker -->
        <path d="M60 22 L92 38 L92 84 Q92 112 60 136 Z" fill="url(#t108)"/>
        <path d="M60 22 L92 38 L92 84 Q92 112 60 136 Z" fill="url(#shineR)"/>
        <!-- region split seam -->
        <line x1="60" y1="22" x2="60" y2="136" stroke="#55503F" stroke-width="0.8" stroke-opacity="0.6"/>

        <!-- crown: gold satin 20° -->
        <path d="M44 6 L44 -8 L52 -1 L60 -9 L68 -1 L76 -8 L76 6 Q60 0 44 6 Z" fill="url(#t20)"/>
        <path d="M44 6 L44 -8 L52 -1 L60 -9 L68 -1 L76 -8 L76 6 Q60 0 44 6 Z" fill="url(#shineL)" opacity="0.7"/>

        <!-- wings: gold satin 145° -->
        <path d="M12 60 L0 50 L-4 37 L10 46 Z" fill="url(#t145)"/>
        <path d="M108 60 L120 50 L124 37 L110 46 Z" fill="url(#t145)"/>
        <path d="M12 60 L0 50 L-4 37 L10 46 Z" fill="url(#shineL)" opacity="0.5"/>
        <path d="M108 60 L120 50 L124 37 L110 46 Z" fill="url(#shineR)" opacity="0.5"/>

        <!-- center diamond: crimson satin 45° + bright keyline -->
        <path d="M60 54 L86 80 L60 106 L34 80 Z" fill="url(#t45r)"/>
        <path d="M60 54 L86 80 L60 106 L34 80 Z" fill="url(#shineL)" opacity="0.45"/>
        <path d="M60 58.5 L81.5 80 L60 101.5 L38.5 80 Z" fill="none" stroke="#E8C275" stroke-width="1.6" stroke-dasharray="2.4 1.5"/>
        <circle cx="60" cy="80" r="7" fill="#F0D88A"/>
        <circle cx="60" cy="80" r="4.6" fill="#7E1A23"/>

        <!-- ── region outlines: split stitch borders (deep tone) ── -->
        <g fill="none" stroke="#3A3526" stroke-width="1" stroke-opacity="0.55">
          <path d="M60 22 L92 38 L92 84 Q92 112 60 136 Q28 112 28 84 L28 38 Z"/>
          <path d="M60 54 L86 80 L60 106 L34 80 Z" stroke="#2E0A0E"/>
        </g>

      </g>
      <g filter="url(#silk-lite)">
        <!-- ── merrow coil edges: thick dashed stroke = wound loops.
             Kept in their own group with minimal jitter — official
             patch borders are crisp and straight ── -->
        <!-- main outline, hugging the satin faces -->
        <path d="M60 13 L99 31 L99 85 Q99 116 60 145 Q21 116 21 85 L21 31 Z"
              fill="none" stroke="#5A430F" stroke-width="9" stroke-linejoin="round"/>
        <path d="M60 13 L99 31 L99 85 Q99 116 60 145 Q21 116 21 85 L21 31 Z"
              fill="none" stroke="url(#coil)" stroke-width="8" stroke-linejoin="round"
              stroke-dasharray="2.4 1.5" stroke-linecap="round"/>
        <!-- inner gap line between coil and satin -->
        <path d="M60 19.5 L94.5 35 L94.5 84 Q94.5 112 60 139 Q25.5 112 25.5 84 L25.5 35 Z"
              fill="none" stroke="#171107" stroke-width="1.6" stroke-opacity="0.8"/>
        <!-- crown + diamond coils, finer -->
        <path d="M44 6 L44 -8 L52 -1 L60 -9 L68 -1 L76 -8 L76 6" fill="none" stroke="#5A430F" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M44 6 L44 -8 L52 -1 L60 -9 L68 -1 L76 -8 L76 6" fill="none" stroke="url(#coil)" stroke-width="4.6" stroke-linejoin="round" stroke-dasharray="2 1.3" stroke-linecap="round"/>
        <path d="M60 54 L86 80 L60 106 L34 80 Z" fill="none" stroke="#5A430F" stroke-width="5"/>
        <path d="M60 54 L86 80 L60 106 L34 80 Z" fill="none" stroke="url(#coil)" stroke-width="4.2" stroke-dasharray="2 1.3" stroke-linecap="round"/>
        <path d="M12 60 L0 50 L-4 37 L10 46 Z M108 60 L120 50 L124 37 L110 46 Z" fill="none" stroke="url(#coil)" stroke-width="3.4" stroke-dasharray="1.8 1.2" stroke-linecap="round"/>
      </g>
    </svg>
    <figcaption>A · 盾形 — 通用纹章元素 · 完全原创</figcaption>
    </figure>
  </div>

  <!-- same patch at UI sizes -->
  <div class="scales">
    <div><svg width="160" height="206" viewBox="-14 -22 148 204"><use href="#lab-aegis"/></svg><div class="cap">160px · 卡片徽标</div></div>
    <div><svg width="96" height="124" viewBox="-14 -22 148 204"><use href="#lab-aegis"/></svg><div class="cap">96px · 列表</div></div>
    <div><svg width="48" height="62" viewBox="-14 -22 148 204"><use href="#lab-aegis"/></svg><div class="cap">48px · 行内</div></div>
  </div>

  <div class="notes">
    <em>工艺对照</em> —— 色块内丝线 = 缎面绣（satin stitch）；同色不同亮度 = 分区换向（左盾面 72° 受光亮、右盾面 108° 背光暗）；
    金色粗边 = 锁边线圈（merrowed edge，粗虚线描边模拟一圈圈缠线）；线条微弯与毛边 = feTurbulence 位移（线头感）；
    布章浮起 = 底布阴影 underlay + 暖金光晕。官方素材同理，只是用专业绣花打版软件 + 3D 渲染完成。
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="lab-aegis"><!-- filled by script --></g>
  </defs>
</svg>
<script>
  // reuse patch A (shield, both groups: satin + coil) for the scale row
  document.querySelectorAll('.hero-patch figure:last-of-type svg > g').forEach(g =>
    document.getElementById('lab-aegis').appendChild(g.cloneNode(true)));
</script>
</body>
</html>
